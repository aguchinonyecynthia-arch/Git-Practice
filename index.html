<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Ecommerce Product Page Main</title>
  </head>
  <script src="script.js"></script>
  <body>
    <main class="container">
      <section>
        <header>
          <div class="logo">
            <img src="images/logo.svg" alt="logo" />
          </div>

          <div class="hamburger">
            &#9776
          </div>

          <nav class="list">
            <ul>
              <li><a href="#">Women</a></li>
              <li><a href="#">About</a></li>
              <li><a href="#">Contact</a></li>
            </ul>
          </nav>

          <div class="cart">
            <img src="images/icon-cart.svg" alt="cart" />
          </div>

          <div class="avatar">
            <img src="images/image-avatar.png" alt="avatar" />
          </div>
        </header>
      </section>

      <section class="first-section">
        <div class="first-shoe">
          <div class="big-shoe">
            <img src="images/image-product-1.jpg" alt="image" />
          </div>

          <div class="small-shoe">
            <div class="shoe">
              <img src="images/image-product-1-thumbnail.jpg" alt="image" />
            </div>

            <div class="shoe">
              <img src="images/image-product-2-thumbnail.jpg" alt="image" />
            </div>

            <div class="shoe">
              <img src="images/image-product-3-thumbnail.jpg" alt="image" />
            </div>

            <div class="shoe">
              <img src="images/image-product-4-thumbnail.jpg" alt="image" />
            </div>
          </div>
        </div>

        <div class="first-content">
          <h3>SNEAKER COMPANY</h3>

          <h1>
            Fall Limited Edition
            <br />
            Sneakers
          </h1>

          <p>
            These low-profile sneakers are your perfect casual wear
            <br />
            companion. Featuring a durable rubber outer sole, they'll
            <br />
            withstand everything the weather acn offer.
          </p>

          <div class="number">
            <div class="num">
              <h2>$125.00</h2>
              <p>$250.00</p>
            </div>

            <div class="numb">
              <h4>50%</h4>
            </div>
          </div>

          <div class="button">
            <div class="calculation">
              <div class="minus">
                <p>-</p>
              </div>

              <div class="minus">
                <p class="zero">0</p>
              </div>

              <div class="minus">
                <p>+</p>
              </div>
            </div>

            <div class="add-to-cart">
              <button>
                <svg width="22" height="20" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M20.925 3.641H3.863L3.61.816A.896.896 0 0 0 2.717 0H.897a.896.896 0 1 0 0 1.792h1l1.031 11.483c.073.828.52 1.726 1.291 2.336C2.83 17.385 4.099 20 6.359 20c1.875 0 3.197-1.87 2.554-3.642h4.905c-.642 1.77.677 3.642 2.555 3.642a2.72 2.72 0 0 0 2.717-2.717 2.72 2.72 0 0 0-2.717-2.717H6.365c-.681 0-1.274-.41-1.53-1.009l14.321-.842a.896.896 0 0 0 .817-.677l1.821-7.283a.897.897 0 0 0-.87-1.114ZM6.358 18.208a.926.926 0 0 1 0-1.85.926.926 0 0 1 0 1.85Zm10.015 0a.926.926 0 0 1 0-1.85.926.926 0 0 1 0 1.85Zm2.021-7.243-13.8.81-.57-6.341h15.753l-1.383 5.53Z"
                    fill="#000"
                    fill-rule="nonzero"
                  />
                </svg>
                Add to cart
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
